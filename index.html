<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DutyLog</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DutyLog">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --navy: #1B263B; --green: #00853F; --light-bg: #F8F9FA; }
        body { font-family: 'Inter', sans-serif; background-color: var(--light-bg); -webkit-tap-highlight-color: transparent; margin: 0; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; color: #94A3B8; cursor: pointer; flex: 1; transition: color 0.2s; }
        .nav-item.active { color: var(--green); }
        .input-field { width: 100%; padding: 0.8rem; border-radius: 0.8rem; border: 1px solid #e2e8f0; outline: none; font-size: 16px; transition: border 0.2s; background: white; }
        .input-field:focus { border-color: var(--green); }
        .password-container { position: relative; width: 100%; }
        .password-toggle { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: #94A3B8; cursor: pointer; }
        html, body { overflow: hidden; height: 100%; position: fixed; width: 100%; }
        #view-container { overflow-y: auto; height: 100vh; -webkit-overflow-scrolling: touch; }
        .btn-primary { background: var(--navy); color: white; padding: 1rem; border-radius: 1rem; font-weight: bold; width: 100%; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .tab-btn { flex: 1; padding: 8px; font-size: 12px; font-weight: bold; border-radius: 10px; transition: all 0.2s; }
        .tab-btn.active { background: var(--green); color: white; }
        .tab-btn.inactive { background: #f1f5f9; color: #94a3b8; }

        /* Loader Overlay */
        #init-loader { position: fixed; inset: 0; background: white; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.3s; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--green); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .tag { padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; margin-right: 4px; background: #e2e8f0; color: #475569; }
        .back-btn { display: flex; align-items: center; gap: 8px; color: var(--navy); font-weight: 600; margin-bottom: 2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="init-loader">
        <div class="spinner mb-4"></div>
        <p class="text-navy font-bold animate-pulse">Initializing DutyLog...</p>
    </div>

    <div id="app">
        <main id="view-container" class="px-4 pt-6 max-w-[600px] mx-auto pb-32"></main>
        
        <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[600px] hidden bg-white border-t px-6 py-3 justify-between items-center z-40 shadow-lg pb-safe">
            <button onclick="router.navigate('dashboard')" class="nav-item active" data-view="dashboard"><i class="fas fa-home text-lg"></i><span>Home</span></button>
            <button onclick="router.navigate('users')" class="nav-item" data-view="users"><i class="fas fa-users text-lg"></i><span>Users</span></button>
            <button onclick="router.navigate('add-duty')" class="nav-item bg-white border-2 border-[#00853F] !text-[#00853F] p-3 -mt-10 rounded-full shadow-xl h-14 w-14 justify-center"><i class="fas fa-plus text-xl"></i></button>
            <button onclick="router.navigate('community')" class="nav-item" data-view="community"><i class="fas fa-rss text-lg"></i><span>Feed</span></button>
            <button onclick="router.navigate('profile')" class="nav-item" data-view="profile"><i class="fas fa-user text-lg"></i><span>Profile</span></button>
        </nav>
    </div>

    <script>
        const supabaseUrl = 'https://qgyjfyazkkepmkztnezv.supabase.co';
        const supabaseKey = 'sb_publishable_xea7e2zxnarbh2bT6vG5ew__2DhOj34';
        const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

        const state = { 
            user: null, 
            profile: null, 
            totalHours: 0,
            currentDuties: [],
            hourMode: 'manual',
            isAdmin: true,
            currentView: null,
            isAuthChecking: true
        };

        const getUserPFP = () => {
            return state.profile?.avatar_url || `https://api.dicebear.com/7.x/avataaars/svg?seed=${state.user?.id}`;
        };

        const router = {
            navigate: async (view) => {
                if (state.currentView === view) return; 
                state.currentView = view;
                
                const container = document.getElementById('view-container');
                const nav = document.getElementById('bottom-nav');
                const isAuthView = ['welcome', 'login', 'signup'].includes(view);
                
                if (!state.user && !isAuthView) {
                    state.currentView = 'welcome';
                    container.innerHTML = await views.welcome();
                    nav.classList.add('hidden');
                    return;
                }

                nav.classList.toggle('hidden', isAuthView);
                nav.classList.toggle('flex', !isAuthView);
                
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.toggle('active', el.getAttribute('data-view') === view);
                });
                
                container.innerHTML = await views[view]();
            }
        };

        const views = {
            welcome: async () => `<div class="flex flex-col items-center justify-center min-h-[80vh] text-center space-y-8">
                <div class="w-24 h-24 bg-white border-4 border-[#00853F] rounded-[2rem] flex items-center justify-center shadow-2xl"><i class="fas fa-plus text-[#00853F] text-5xl"></i></div>
                <h1 class="text-4xl font-black text-[#1B263B]">DutyLog</h1>
                <div class="w-full space-y-3 px-4 max-w-xs">
                    <button onclick="router.navigate('login')" class="btn-primary">Login</button>
                    <button onclick="router.navigate('signup')" class="w-full bg-white border-2 border-[#1B263B] py-4 rounded-2xl font-bold">Sign Up</button>
                </div>
            </div>`,
            login: async () => `<div class="pt-4 max-w-sm mx-auto">
                <div onclick="router.navigate('welcome')" class="back-btn"><i class="fas fa-arrow-left"></i> Back</div>
                <h2 class="text-2xl font-bold mb-8">Login</h2>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <input type="email" id="login-email" placeholder="Email" required class="input-field" autocomplete="email">
                    <div class="password-container"><input type="password" id="login-password" placeholder="Password" required class="input-field" autocomplete="current-password"><i class="fas fa-eye password-toggle" onclick="togglePassword('login-password')"></i></div>
                    <button type="submit" id="login-btn" class="btn-primary">Sign In</button>
                </form>
            </div>`,
            signup: async () => `<div class="pt-4 max-w-sm mx-auto">
                <div onclick="router.navigate('welcome')" class="back-btn"><i class="fas fa-arrow-left"></i> Back</div>
                <h2 class="text-2xl font-bold mb-6">Register</h2>
                <form onsubmit="handleSignup(event)" class="space-y-4">
                    <input type="text" id="signup-name" placeholder="Full Name" required class="input-field">
                    <input type="text" id="signup-division" placeholder="Division (Primary Tag)" required class="input-field">
                    <input type="email" id="signup-email" placeholder="Email" required class="input-field" autocomplete="email">
                    <input type="password" id="signup-password" placeholder="Password" required class="input-field" autocomplete="new-password">
                    <button type="submit" id="signup-btn" class="btn-primary">Create Account</button>
                </form>
            </div>`,
            dashboard: async () => {
                setTimeout(loadDashboardData, 50);
                return `<div class="animate-pulse space-y-4"><div class="h-40 bg-slate-200 rounded-2xl"></div></div>`;
            },
            profile: async () => `<div class="space-y-8 pt-4 px-4 pb-10 text-center">
                <div class="relative w-24 h-24 mx-auto">
                    <img src="${getUserPFP()}" class="w-24 h-24 rounded-full border-4 border-green-500 shadow-lg object-cover">
                    <button onclick="editAvatar()" class="absolute bottom-0 right-0 bg-navy text-white rounded-full p-2 text-xs shadow-md border border-white"><i class="fas fa-camera"></i></button>
                </div>
                <h2 class="text-2xl font-bold">${state.profile?.name || 'Volunteer'}</h2>
                <div class="flex flex-wrap justify-center gap-1">
                    ${(state.profile?.tags || state.profile?.division || 'Member').split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('')}
                </div>
                <button onclick="handleLogout()" class="btn-primary !bg-red-500 mt-10">Sign Out</button>
            </div>`,
            'add-duty': async () => {
                state.hourMode = 'manual';
                return `<div class="px-2">
                    <h2 class="text-2xl font-bold mb-6">Log Activity</h2>
                    <form onsubmit="handleSaveDuty(event)" class="space-y-4">
                        <input type="text" id="duty-title" placeholder="Event Title" required class="input-field">
                        <input type="text" id="duty-location" placeholder="Location" class="input-field">
                        <input type="date" id="duty-date" value="${new Date().toISOString().split('T')[0]}" class="input-field">
                        <div class="glass-card p-4 space-y-4">
                            <div class="flex bg-slate-100 p-1 rounded-xl">
                                <button type="button" onclick="window.setHourMode('manual')" id="mode-manual" class="tab-btn active">Hours</button>
                                <button type="button" onclick="window.setHourMode('auto')" id="mode-auto" class="tab-btn inactive">Auto Calc</button>
                            </div>
                            <div id="manual-hours-input"><input type="number" step="0.1" id="duty-hours" placeholder="Total Hours" class="input-field"></div>
                            <div id="auto-hours-input" class="hidden flex gap-2">
                                <input type="time" id="start-time" class="input-field" oninput="window.calculateHours()">
                                <input type="time" id="end-time" class="input-field" oninput="window.calculateHours()">
                            </div>
                            <div id="calc-result" class="hidden text-center text-xs font-bold text-green-600">Calculated: <span id="calc-display">0</span> hrs</div>
                        </div>
                        <textarea id="duty-notes" placeholder="Notes (Optional)" class="input-field min-h-[100px]"></textarea>
                        <button type="submit" class="btn-primary !bg-[#00853F]">Save Activity</button>
                    </form>
                </div>`;
            },
            users: async () => {
                setTimeout(loadUsers, 50);
                return `<div class="p-4"><h2 class="text-2xl font-bold mb-4">User Directory</h2><div id="users-list" class="space-y-3">Loading users...</div></div>`;
            },
            community: async () => {
                setTimeout(loadFeed, 50);
                return `<div class="p-4">
                    <h2 class="text-2xl font-bold mb-4">Community Feed</h2>
                    <div class="glass-card p-4 mb-6">
                        <form onsubmit="handlePostFeed(event)" class="space-y-2">
                            <textarea id="feed-post-text" placeholder="What's happening?" required class="input-field text-sm min-h-[80px] bg-slate-50"></textarea>
                            <button type="submit" id="feed-post-btn" class="bg-green-600 text-white text-xs font-bold py-2 px-4 rounded-xl float-right">Post Update</button>
                            <div class="clear-both"></div>
                        </form>
                    </div>
                    <div id="feed-list" class="space-y-4">Loading feed...</div>
                </div>`;
            }
        };

        // --- Auth Functions ---
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            btn.innerText = 'Signing in...';
            btn.disabled = true;

            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) throw error;
            } catch (err) {
                console.error("Login Error:", err);
                alert("Login Failed: " + err.message);
                btn.innerText = 'Sign In';
                btn.disabled = false;
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('signup-btn');
            const name = document.getElementById('signup-name').value;
            const division = document.getElementById('signup-division').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            
            btn.innerText = 'Creating...';
            btn.disabled = true;

            try {
                const { data, error } = await sb.auth.signUp({ email, password });
                if (error) throw error;
                if (data.user) {
                    await sb.from('profiles').upsert({ id: data.user.id, name, division, tags: division });
                    alert("Account created! Please log in.");
                    router.navigate('login');
                }
            } catch (err) {
                console.error("Signup Error:", err);
                alert(err.message);
                btn.innerText = 'Create Account';
                btn.disabled = false;
            }
        }

        async function handleLogout() {
            document.getElementById('init-loader').style.display = 'flex';
            document.getElementById('init-loader').style.opacity = '1';
            await sb.auth.signOut();
        }

        // --- Data Loaders ---
        async function loadDashboardData() {
            if (!state.user) return;
            const { data } = await sb.from('duties').select('*').eq('user_id', state.user.id).neq('title', 'Post').order('date', { ascending: false });
            state.currentDuties = data || [];
            state.totalHours = state.currentDuties.reduce((acc, curr) => acc + (parseFloat(curr.total_hours) || 0), 0);
            const container = document.getElementById('view-container');
            if(!container || state.currentView !== 'dashboard') return;
            
            container.innerHTML = `
                <div class="space-y-6">
                    <header class="flex justify-between items-center">
                        <div><h1 class="text-xl font-bold">DutyLog</h1><p class="text-xs text-slate-400">${state.profile?.division || 'SJA'}</p></div>
                        <img src="${getUserPFP()}" class="w-10 h-10 rounded-full border-2 border-green-500 object-cover shadow-sm">
                    </header>
                    <div class="glass-card p-6 bg-[#1B263B] text-white">
                        <p class="text-[10px] opacity-70 uppercase font-bold tracking-widest">Logged Hours</p>
                        <h2 class="text-4xl font-black">${state.totalHours.toFixed(1)}</h2>
                    </div>
                    <div class="space-y-3">
                        ${state.currentDuties.map(d => `
                            <div class="glass-card p-4 flex justify-between items-center">
                                <div><p class="font-bold text-sm text-navy">${d.title}</p><p class="text-[10px] text-slate-400">${d.date}</p></div>
                                <p class="font-black text-green-600 text-sm">+${parseFloat(d.total_hours).toFixed(1)}</p>
                            </div>
                        `).join('') || '<p class="text-center py-10 text-slate-400">No logs yet.</p>'}
                    </div>
                </div>`;
        }

        async function loadFeed() {
            const { data } = await sb.from('duties').select('*, profiles(name, tags, division, avatar_url)').order('created_at', { ascending: false }).limit(25);
            const list = document.getElementById('feed-list');
            if(!list || state.currentView !== 'community') return;
            list.innerHTML = (data || []).map(f => {
                const isPost = f.is_update || f.title === "Post";
                const pfp = f.profiles?.avatar_url || `https://api.dicebear.com/7.x/avataaars/svg?seed=${f.user_id}`;
                return `<div class="glass-card p-4 border-l-4 ${isPost ? 'border-navy bg-slate-50' : 'border-green-500'}">
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2">
                            <img src="${pfp}" class="w-6 h-6 rounded-full border object-cover">
                            <div>
                                <p class="text-[10px] font-black uppercase text-slate-400 leading-none">${f.profiles?.name || 'User'}</p>
                                <div class="flex gap-1 mt-1">${(f.profiles?.tags || f.profiles?.division || 'Member').split(',').slice(0,2).map(t => `<span class="tag" style="font-size:7px; padding: 1px 4px">${t.trim()}</span>`).join('')}</div>
                            </div>
                        </div>
                        <p class="text-[9px] text-slate-300 font-bold">${f.date}</p>
                    </div>
                    ${!isPost ? `<p class="font-bold text-navy text-sm">${f.title}</p>` : ''}
                    <div class="text-xs ${isPost ? 'text-navy leading-relaxed' : 'text-slate-600 font-medium'}">${f.notes}</div>
                    ${!isPost ? `<p class="text-xs text-green-600 font-bold mt-2">+${f.total_hours} Hours</p>` : ''}
                </div>`;
            }).join('') || '<p class="text-center text-slate-400">No activity yet.</p>';
        }

        async function loadUsers() {
            const { data } = await sb.from('profiles').select('*');
            const list = document.getElementById('users-list');
            if(!list || state.currentView !== 'users') return;
            list.innerHTML = (data || []).map(u => `
                <div class="glass-card p-4 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img src="${u.avatar_url || `https://api.dicebear.com/7.x/avataaars/svg?seed=${u.id}`}" class="w-10 h-10 rounded-full border object-cover">
                        <div>
                            <p class="font-bold text-sm text-navy">${u.name}</p>
                            <div class="flex flex-wrap gap-1 mt-1">${(u.tags || u.division || 'Member').split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('')}</div>
                        </div>
                    </div>
                    ${state.isAdmin ? `<button onclick="window.editUserProfile('${u.id}', '${u.name}', '${u.tags || u.division || ''}')" class="text-navy p-2"><i class="fas fa-edit"></i></button>` : ''}
                </div>`).join('') || '<p class="text-center text-slate-400">No users found.</p>';
        }

        // --- UI Interactions ---
        window.togglePassword = (id) => {
            const el = document.getElementById(id);
            el.type = el.type === 'password' ? 'text' : 'password';
        };

        window.setHourMode = (mode) => {
            state.hourMode = mode;
            document.getElementById('manual-hours-input')?.classList.toggle('hidden', mode === 'auto');
            document.getElementById('auto-hours-input')?.classList.toggle('hidden', mode === 'manual');
            document.getElementById('calc-result')?.classList.toggle('hidden', mode === 'manual');
            document.getElementById('mode-manual').className = mode === 'manual' ? 'tab-btn active' : 'tab-btn inactive';
            document.getElementById('mode-auto').className = mode === 'auto' ? 'tab-btn active' : 'tab-btn inactive';
        };

        window.calculateHours = () => {
            const start = document.getElementById('start-time').value;
            const end = document.getElementById('end-time').value;
            if(!start || !end) return;
            const [sH, sM] = start.split(':').map(Number);
            const [eH, eM] = end.split(':').map(Number);
            let diff = (eH * 60 + eM) - (sH * 60 + sM);
            if(diff < 0) diff += 1440;
            const hrs = (diff / 60).toFixed(2);
            const display = document.getElementById('calc-display');
            if(display) display.innerText = hrs;
            const input = document.getElementById('duty-hours');
            if(input) input.value = hrs;
        };

        window.editAvatar = async () => {
            const url = prompt("Direct link to your profile image:", state.profile?.avatar_url || "");
            if (url !== null) {
                const { error } = await sb.from('profiles').update({ avatar_url: url }).eq('id', state.user.id);
                if (!error) {
                    state.profile.avatar_url = url;
                    router.navigate('profile');
                } else alert(error.message);
            }
        };

        async function init() {
            const loader = document.getElementById('init-loader');
            sb.auth.onAuthStateChange(async (event, session) => {
                if (session) {
                    state.user = session.user;
                    const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
                    state.profile = data;
                    await router.navigate('dashboard');
                } else {
                    state.user = null;
                    state.profile = null;
                    await router.navigate('welcome');
                }
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
