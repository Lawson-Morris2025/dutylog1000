<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DutyLog Pro</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DutyLog">
    
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkR1dHlMb2cgUHJvIiwKICAic2hvcnRfbmFtZSI6ICJEdXR5TG9nIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNGOEY5RkEiLAogICJ0aGVtZV9jb2xvciI6ICIjMUIyNjNCIiwKICAiaWNvbnMiOiBbCiAgICB7CiAgICAgICJzcmMiOiAiaHR0cHM6Ly9hcGkuZGljZWJlYXIuY29tLzcueC9pZGVudGicol9zdmc/c2VlZD1kdXR5bG9nIiwKICAic2l6ZXMiOiA1MTJ4NTEyIiwKICAidHlwZSI6ICJpbWFnZS9zdmcreG1sIgogICB9CiAgXQp9">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --navy: #1B263B; --green: #00853F; --light-bg: #F8F9FA; --red: #DC2626; }
        body { font-family: 'Inter', sans-serif; background-color: var(--light-bg); -webkit-tap-highlight-color: transparent; margin: 0; padding-top: env(safe-area-inset-top); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; color: #94A3B8; cursor: pointer; flex: 1; transition: color 0.2s; }
        .nav-item.active { color: var(--green); }
        .input-field { width: 100%; padding: 0.8rem; border-radius: 0.8rem; border: 1px solid #e2e8f0; outline: none; font-size: 16px; transition: border 0.2s; background: white; color: var(--navy); }
        .input-field:focus { border-color: var(--green); }
        html, body { overflow: hidden; height: 100%; position: fixed; width: 100%; }
        #view-container { overflow-y: auto; height: 100vh; -webkit-overflow-scrolling: touch; padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
        .btn-primary { background: var(--navy); color: white; padding: 1rem; border-radius: 1rem; font-weight: bold; width: 100%; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-primary:disabled { background: #94A3B8; cursor: not-allowed; }
        
        .scroller-container { display: flex; align-items: center; justify-content: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1rem; }
        .scroll-wheel-column { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .scroll-select { background: white; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 1.2rem; font-weight: 800; color: var(--navy); padding: 0.5rem; width: 80px; text-align: center; outline: none; }
        
        #init-loader { position: fixed; inset: 0; background: white; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--green); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tag { padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 800; text-transform: uppercase; background: #E2E8F0; color: #475569; }
        .tag-badge { background: #E0F2FE; color: #0369A1; }
        .back-btn { display: flex; align-items: center; gap: 8px; color: var(--navy); font-weight: 600; margin-bottom: 2rem; cursor: pointer; }
        
        .tab-btn { padding: 0.6rem 1rem; font-size: 0.75rem; font-weight: 700; border-radius: 0.75rem; color: #64748B; background: #F1F5F9; transition: all 0.2s; }
        .tab-btn.active { background: var(--navy); color: white; }
        
        .drabsc-trigger { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 1rem; text-align: left; font-weight: 800; border-radius: 1rem; transition: background 0.2s; }
        .drabsc-content { max-height: 0; overflow: hidden; transition: max-height 0.25s ease-out; padding: 0 1rem; font-size: 0.85rem; color: #475569; }
        .drabsc-item.open .drabsc-content { max-height: 200px; padding: 0.5rem 1rem 1rem 1rem; }
        .drabsc-letter { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 0.5rem; font-weight: 900; color: white; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="init-loader">
        <div class="spinner mb-4"></div>
        <p class="text-navy font-bold animate-pulse">Loading DutyLog Platform...</p>
    </div>

    <div id="app">
        <main id="view-container" class="px-4 pt-6 max-w-[600px] mx-auto"></main>
        
        <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[600px] hidden bg-white border-t px-4 py-3 justify-between items-center z-40 shadow-lg pb-safe">
            <button onclick="router.navigate('dashboard')" class="nav-item active" data-view="dashboard"><i class="fas fa-home text-lg"></i><span>Dashboard</span></button>
            <button onclick="router.navigate('feed')" class="nav-item" data-view="feed"><i class="fas fa-images text-lg"></i><span>Feed</span></button>
            <button onclick="router.navigate('add-duty')" class="nav-item bg-white border-2 border-[#00853F] !text-[#00853F] p-3 -mt-10 rounded-full shadow-xl h-14 w-14 justify-center"><i class="fas fa-plus text-xl"></i></button>
            <button onclick="router.navigate('notes-view')" class="nav-item" data-view="notes-view"><i class="fas fa-clipboard-list text-lg"></i><span>Notes Log</span></button>
            <button onclick="router.navigate('profile')" class="nav-item" data-view="profile"><i class="fas fa-user text-lg"></i><span>Profile</span></button>
        </nav>
    </div>

    <script>
        const supabaseUrl = 'https://qgyjfyazkkepmkztnezv.supabase.co';
        const supabaseKey = 'sb_publishable_xea7e2zxnarbh2bT6vG5ew__2DhOj34';
        const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

        const state = { 
            user: null, 
            profile: null, 
            totalHoursString: "0h 0m",
            totalHoursNumeric: 0,
            currentDuties: [],
            feedPosts: [],
            currentView: null,
            editingDutyId: null,
            timeInputMode: 'duration',
            calculatedHours: 0,
            calculatedMinutes: 0,
            notesActiveTab: 'logs',
            initialized: false
        };

        const saveLocalCache = (key, data) => localStorage.setItem(`dutylog_pro_${key}`, JSON.stringify(data));
        const getLocalCache = (key) => JSON.parse(localStorage.getItem(`dutylog_pro_${key}`));
        const getUserPFP = (url, id) => url || `https://api.dicebear.com/7.x/avataaars/svg?seed=${id || 'volunteer'}`;

        const router = {
            navigate: async (view) => {
                if (state.currentView === view && !state.editingDutyId) return; 
                state.currentView = view;
                
                const container = document.getElementById('view-container');
                const nav = document.getElementById('bottom-nav');
                if (!container || !nav) return;
                
                const isAuthView = ['welcome', 'login', 'signup'].includes(view);
                
                if (!state.user && !isAuthView) {
                    state.currentView = 'welcome';
                    container.innerHTML = await views.welcome();
                    nav.classList.add('hidden');
                    hideLoader();
                    return;
                }

                nav.classList.toggle('hidden', isAuthView);
                nav.classList.toggle('flex', !isAuthView);
                
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.toggle('active', el.getAttribute('data-view') === view);
                });
                
                if (views[view]) {
                    container.innerHTML = await views[view]();
                }
                hideLoader();
            }
        };

        function hideLoader() {
            const loader = document.getElementById('init-loader');
            if (loader) loader.style.display = 'none';
        }

        function parseDatabaseHoursToUiTime(val) {
            const num = parseFloat(val) || 0;
            const str = num.toString();
            if (str.includes('.') && str.split('.')[1].length <= 2) {
                const parts = str.split('.');
                let hrs = parseInt(parts[0]);
                let mins = parseInt(parts[1]);
                if (parts[1].length === 1) mins = mins * 10;
                if (mins < 60) return { hours: hrs, minutes: mins };
            }
            const hours = Math.floor(num);
            const minutes = Math.round((num - hours) * 60);
            return { hours, minutes };
        }

        function renderDashboardHTML(hoursStr, duties) {
            return duties.map(d => {
                const t = parseDatabaseHoursToUiTime(d.total_hours);
                return `<div class="glass-card p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50" onclick="triggerEditDuty('${d.id}')">
                    <div>
                        <p class="font-bold text-sm text-navy">${d.title}</p>
                        <p class="text-[10px] text-slate-400">${d.date}</p>
                    </div>
                    <p class="font-black text-green-600 text-sm flex-shrink-0 ml-2">+${t.hours}h ${t.minutes}m</p>
                </div>`;
            }).join('') || '<p class="text-center py-10 text-slate-400">No shifts saved yet.</p>';
        }

        const views = {
            welcome: async () => `<div class="flex flex-col items-center justify-center min-h-[80vh] text-center space-y-8">
                <div class="w-24 h-24 bg-white border-4 border-[#00853F] rounded-[2rem] flex items-center justify-center shadow-2xl"><i class="fas fa-clock text-[#00853F] text-5xl"></i></div>
                <div>
                    <h1 class="text-4xl font-black text-[#1B263B]">DutyLog Pro</h1>
                    <p class="text-xs text-slate-400 font-medium mt-1">Operational Hour Tracking & Notes Utility</p>
                </div>
                <div class="w-full space-y-3 px-4 max-w-xs">
                    <button onclick="router.navigate('login')" class="btn-primary">Login</button>
                    <button onclick="router.navigate('signup')" class="w-full bg-white border-2 border-[#1B263B] py-4 rounded-2xl font-bold">Register Division Account</button>
                </div>
            </div>`,
            login: async () => `<div class="pt-4 max-w-sm mx-auto">
                <div onclick="router.navigate('welcome')" class="back-btn"><i class="fas fa-arrow-left"></i> Back</div>
                <h2 class="text-2xl font-bold mb-8">Sign In</h2>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <input type="email" id="login-email" placeholder="Email" bookkeeping="off" required class="input-field">
                    <input type="password" id="login-password" placeholder="Password" required class="input-field">
                    <button type="submit" id="login-btn" class="btn-primary">Sign In</button>
                </form>
            </div>`,
            signup: async () => `<div class="pt-4 max-w-sm mx-auto">
                <div onclick="router.navigate('welcome')" class="back-btn"><i class="fas fa-arrow-left"></i> Back</div>
                <h2 class="text-2xl font-bold mb-6">Create Account</h2>
                <form onsubmit="handleSignup(event)" class="space-y-4">
                    <input type="text" id="signup-name" placeholder="Full Name" required class="input-field">
                    <input type="text" id="signup-division" placeholder="Division (e.g. Cardiff)" required class="input-field">
                    <input type="email" id="signup-email" placeholder="Email" required class="input-field">
                    <input type="password" id="signup-password" placeholder="Password" required class="input-field">
                    <button type="submit" id="signup-btn" class="btn-primary">Register</button>
                </form>
            </div>`,
            dashboard: async () => {
                const cachedDuties = getLocalCache('duties') || [];
                const cachedHoursString = localStorage.getItem('dutylog_totalhours_string') || "0h 0m";
                setTimeout(loadDashboardData, 10);
                return `<div class="space-y-6">
                    <header class="flex justify-between items-center">
                        <div>
                            <h1 class="text-xl font-bold text-navy">${state.profile?.name || 'Volunteer'}</h1>
                            <div class="flex gap-1.5 items-center mt-0.5">
                                <span class="tag text-[9px]">${state.profile?.division || 'Cardiff'}</span>
                                <span class="tag tag-badge text-[9px]">${state.profile?.badge || 'Cadet'}</span>
                            </div>
                        </div>
                        <img src="${getUserPFP(state.profile?.avatar_url, state.user?.id)}" class="w-10 h-10 rounded-full border-2 border-green-500 object-cover shadow-sm">
                    </header>
                    <div class="glass-card p-6 bg-[#1B263B] text-white relative overflow-hidden">
                        <p class="text-[10px] opacity-70 uppercase font-bold tracking-widest">Total Logged Shift Time</p>
                        <h2 class="text-4xl font-black tracking-tight" id="dash-hours-banner">${cachedHoursString}</h2>
                    </div>
                    <div class="flex items-center justify-between px-1"><h3 class="font-bold text-navy text-sm">Shift Records</h3></div>
                    <div class="space-y-3" id="dashboard-list">
                        ${renderDashboardHTML(cachedHoursString, cachedDuties)}
                    </div>
                </div>`;
            },
            feed: async () => {
                const cachedFeed = getLocalCache('feed') || [];
                setTimeout(loadFeedPosts, 10);
                return `<div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-navy">Division Feed</h2>
                        <button onclick="openPublishMediaModal()" class="bg-green-600 text-white text-xs font-bold py-2 px-4 rounded-xl"><i class="fas fa-camera mr-1"></i> Post Media</button>
                    </div>
                    <div id="feed-container" class="space-y-6 pb-12">${renderFeedHTML(state.feedPosts.length ? state.feedPosts : cachedFeed)}</div>
                </div>`;
            },
            'notes-view': async () => {
                setTimeout(() => {
                    switchNotesTab(state.notesActiveTab);
                }, 10);

                return `<div class="space-y-4">
                    <div>
                        <h2 class="text-2xl font-bold text-navy">Operational Utilities</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Review saved shift notes or access clinical response guides.</p>
                    </div>
                    
                    <div class="flex gap-2 bg-slate-100 p-1 rounded-xl">
                        <button id="notes-tab-logs" onclick="switchNotesTab('logs')" class="flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-500 transition-all">Shift Logs</button>
                        <button id="notes-tab-drabsc" onclick="switchNotesTab('drabsc')" class="flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-500 transition-all flex items-center justify-center gap-1.5"><i class="fas fa-heartbeat text-red-500"></i> DRABSC Guide</button>
                    </div>

                    <div id="notes-tab-content" class="space-y-4 pb-12"></div>
                </div>`;
            },
            'add-duty': async () => {
                let targetLog = { title: '', date: new Date().toISOString().split('T')[0], notes: '', total_hours: '0.00' };
                if (state.editingDutyId) {
                    const found = state.currentDuties.find(d => d.id === state.editingDutyId);
                    if (found) targetLog = found;
                }
                const parsedTime = parseDatabaseHoursToUiTime(targetLog.total_hours);
                
                state.calculatedHours = parsedTime.hours;
                state.calculatedMinutes = parsedTime.minutes;
                state.timeInputMode = 'duration'; 

                setTimeout(() => {
                    switchTimeInputMode('duration', parsedTime.hours, parsedTime.minutes);
                    updateNotesCounter();
                }, 15);

                return `<div class="px-2 space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-navy">${state.editingDutyId ? 'Modify Shift Record' : 'Log Operational Duty'}</h2>
                        <button type="button" onclick="openSmartImportModal()" class="bg-indigo-600 text-white text-[11px] font-black px-3 py-2 rounded-xl flex items-center gap-1.5 shadow-sm"><i class="fas fa-brain"></i> AI Import</button>
                    </div>
                    
                    <form onsubmit="handleSaveDuty(event)" class="space-y-4">
                        <input type="text" id="duty-title" placeholder="Event / Shift Title" value="${targetLog.title}" required class="input-field">
                        <input type="date" id="duty-date" value="${targetLog.date}" class="input-field">
                        
                        <div class="glass-card p-4 space-y-4">
                            <div class="flex justify-center gap-2 border-b pb-3 border-slate-100">
                                <button type="button" id="tab-duration" onclick="switchTimeInputMode('duration')" class="tab-btn active">Log Duration</button>
                                <button type="button" id="tab-window" onclick="switchTimeInputMode('window')" class="tab-btn">Log Start / End</button>
                            </div>
                            
                            <div id="time-input-container-mount"></div>
                            
                            <div class="text-center text-xs font-bold text-green-600 mt-2">Calculated Total Time: <span id="calc-display">0h 0m</span></div>
                        </div>
                        
                        <div class="glass-card p-4 border border-slate-100 bg-white space-y-2">
                            <div class="flex justify-between items-center">
                                <label class="text-xs font-bold text-navy flex items-center gap-1.5">
                                    <i class="fas fa-clipboard-list text-green-600"></i> Duty Summary & Operational Notes
                                </label>
                                <span id="notes-counter" class="text-[10px] text-slate-400 font-medium">0 / 400 characters</span>
                            </div>
                            <textarea id="duty-notes" 
                                      placeholder="Provide details about clinical tasks, operations, or incidents handled..." 
                                      maxlength="400"
                                      oninput="updateNotesCounter()"
                                      class="w-full bg-slate-50 text-sm p-3 rounded-xl border border-slate-200 outline-none focus:border-green-600 transition-all min-h-[90px] text-navy placeholder:text-slate-400 leading-relaxed">${targetLog.notes || ''}</textarea>
                        </div>

                        <button type="submit" id="duty-save-btn" class="btn-primary !bg-[#00853F]">Save Shift</button>
                    </form>
                </div>`;
            },
            profile: async () => `<div class="space-y-6 pt-4 max-w-sm mx-auto">
                <div class="relative w-24 h-24 mx-auto text-center">
                    <img id="profile-img" src="${getUserPFP(state.profile?.avatar_url, state.user?.id)}" class="w-24 h-24 rounded-full border-4 border-green-500 shadow-lg object-cover mx-auto">
                    <label class="absolute bottom-0 right-2 bg-navy text-white rounded-full p-2 text-xs shadow-md border border-white cursor-pointer">
                        <i class="fas fa-camera"></i>
                        <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="uploadCompressedAvatar(event)">
                    </label>
                </div>
                
                <form onsubmit="handleUpdateProfile(event)" class="glass-card p-5 space-y-4 bg-white">
                    <h3 class="font-bold text-navy text-sm border-b pb-2"><i class="fas fa-sliders-h mr-2 text-green-600"></i>Edit Settings</h3>
                    <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">Username / Name</label>
                        <input type="text" id="profile-name" value="${state.profile?.name || ''}" class="input-field text-sm" required placeholder="Enter name">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">Badge / Rank</label>
                        <input type="text" id="profile-badge" value="${state.profile?.badge || ''}" class="input-field text-sm font-semibold" required placeholder="e.g. Cadet">
                    </div>
                    <button type="submit" id="profile-save-btn" class="w-full bg-[#00853F] text-white p-3 rounded-xl font-bold text-sm shadow-md">Save Changes</button>
                </form>

                <div class="glass-card p-5 bg-white space-y-3">
                    <h3 class="font-bold text-navy text-sm border-b pb-2"><i class="fas fa-bell mr-2 text-blue-500"></i>System Notifications</h3>
                    <p class="text-[11px] text-slate-400">Receive system-wide native alerts instantly when a new team post is configured to the Feed stream.</p>
                    <button onclick="requestNotificationAccess()" class="w-full bg-navy text-white p-3 rounded-xl font-bold text-xs shadow-sm"><i class="fas fa-mobile-alt mr-2"></i>Enable Native Push</button>
                </div>

                <button onclick="handleLogout()" class="w-full bg-red-500 text-white p-4 rounded-2xl font-bold shadow-md">Sign Out Account</button>
            </div>`
        };

        window.openSmartImportModal = function() {
            const modal = document.createElement('div');
            modal.id = 'import-modal';
            modal.className = 'fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm';
            modal.innerHTML = `
                <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                    <div class="flex items-center gap-2 text-indigo-600 font-black text-sm">
                        <i class="fas fa-brain"></i> AI Text Engine Import
                    </div>
                    <p class="text-[11px] text-slate-400 leading-relaxed">Paste your raw summary text. The engine intelligently classifies if it contains shift hours, operational notes, or both, filling your log fields instantly.</p>
                    <textarea id="import-raw-txt" placeholder="Example: Worked 4 hours at the stadium event today. Treated two minor abrasions." class="input-field min-h-[120px] text-xs leading-relaxed"></textarea>
                    <div class="flex gap-2">
                        <button onclick="document.getElementById('import-modal').remove()" class="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl text-xs">Cancel</button>
                        <button onclick="processSmartImport()" class="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl text-xs">Analyze & Populate</button>
                    </div>
                </div>`;
            document.getElementById('app').appendChild(modal);
        };

        window.processSmartImport = function() {
            const text = document.getElementById('import-raw-txt').value;
            if(!text.trim()) return;

            let extractedHours = 0;
            let extractedMinutes = 0;
            let extractedNotes = text;

            const hourMatch = text.match(/(\d+(\.\d+)?)\s*(hr|hour|shift)/i);
            const minMatch = text.match(/(\d+)\s*(min)/i);

            if (hourMatch) {
                const rawHr = parseFloat(hourMatch[1]);
                if(rawHr % 1 !== 0) {
                    extractedHours = Math.floor(rawHr);
                    extractedMinutes = Math.round((rawHr % 1) * 60);
                } else {
                    extractedHours = parseInt(rawHr);
                }
            }
            if (minMatch) {
                extractedMinutes = parseInt(minMatch[1]);
            }

            const titleEl = document.getElementById('duty-title');
            const notesEl = document.getElementById('duty-notes');

            if(titleEl && !titleEl.value) {
                titleEl.value = "Imported Shift Duty";
            }
            if(notesEl) {
                notesEl.value = extractedNotes.substring(0, 400);
                updateNotesCounter();
            }

            switchTimeInputMode('duration', extractedHours, extractedMinutes);
            
            const modal = document.getElementById('import-modal');
            if (modal) modal.remove();
        };

        window.switchNotesTab = function(tab) {
            state.notesActiveTab = tab;
            const container = document.getElementById('notes-tab-content');
            if (!container) return;

            const tabLogs = document.getElementById('notes-tab-logs');
            const tabDrabsc = document.getElementById('notes-tab-drabsc');

            if (tabLogs) tabLogs.className = tab === 'logs' ? 'flex-1 py-2.5 text-xs font-bold rounded-lg bg-white text-navy shadow-sm' : 'flex-1 py-2.5 text-xs font-bold rounded-lg text-slate-500';

        window.switchTimeInputMode = function(mode, defaultH = 0, defaultM = 0) {
            state.timeInputMode = mode;
            const durTab = document.getElementById('tab-duration');
            const winTab = document.getElementById('tab-window');
            if(durTab) durTab.classList.toggle('active', mode === 'duration');
            if(winTab) winTab.classList.toggle('active', mode === 'window');
            
            const mount = document.getElementById('time-input-container-mount');
            if (!mount) return;

            if (mode === 'duration') {
                let hourOptions = "", minOptions = "";
                for (let i = 0; i <= 24; i++) hourOptions += `<option value="${i}" ${i === defaultH ? 'selected' : ''}>${i}</option>`;
                for (let i = 0; i < 60; i += 5) minOptions += `<option value="${i}" ${i === defaultM ? 'selected' : ''}>${i < 10 ? '0' + i : i}</option>`;
                
                mount.innerHTML = `
                    <div class="scroller-container">
                        <div class="scroll-wheel-column"><select id="scroll-hr" class="scroll-select" onchange="updateScrollCalculation()">${hourOptions}</select></div>
                        <div class="text-xl font-black text-slate-400 px-2">:</div>
                        <div class="scroll-wheel-column"><select id="scroll-min" class="scroll-select" onchange="updateScrollCalculation()">${minOptions}</select></div>
                    </div>`;
                updateScrollCalculation();
            } else {
                mount.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Start Time</label>
                            <input type="time" id="time-start" class="input-field font-bold text-center" onchange="updateWindowCalculation()">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">End Time</label>
                            <input type="time" id="time-end" class="input-field font-bold text-center" onchange="updateWindowCalculation()">
                        </div>
                    </div>`;
                const display = document.getElementById('calc-display');
                if(display) display.innerText = `${state.calculatedHours}h ${state.calculatedMinutes}m`;
            }
        };

        window.updateScrollCalculation = function() {
            const hrEl = document.getElementById('scroll-hr');
            const minEl = document.getElementById('scroll-min');
            if(!hrEl || !minEl) return;
            state.calculatedHours = parseInt(hrEl.value) || 0;
            state.calculatedMinutes = parseInt(minEl.value) || 0;
            const display = document.getElementById('calc-display');
            if(display) display.innerText = `${state.calculatedHours}h ${state.calculatedMinutes}m`;
        };

        window.updateWindowCalculation = function() {
            const startVal = document.getElementById('time-start').value;
            const endVal = document.getElementById('time-end').value;
            if (!startVal || !endVal) return;

            const [startH, startM] = startVal.split(':').map(Number);
            let [endH, endM] = endVal.split(':').map(Number);

            let diffMins = (endH * 60 + endM) - (startH * 60 + startM);
            if (diffMins < 0) diffMins += 24 * 60; 

            state.calculatedHours = Math.floor(diffMins / 60);
            state.calculatedMinutes = diffMins % 60;
            const display = document.getElementById('calc-display');
            if(display) display.innerText = `${state.calculatedHours}h ${state.calculatedMinutes}m`;
        };

        async function submitFeedPost() {
            const btn = document.getElementById('post-submit-btn');
            const desc = document.getElementById('post-desc').value;
            const fileInput = document.getElementById('feed-file-input');
            const file = fileInput.files ? fileInput.files[0] : null;
            
            if (btn) { btn.innerText = "Uploading..."; btn.disabled = true; }
            let mediaUrl = null;
            let mediaType = 'image';

            if (file) {
                mediaType = file.type.startsWith('video') ? 'video' : 'image';
                mediaUrl = await new Promise((res) => {
                    const r = new FileReader();
                    r.onload = (e) => res(e.target.result);
                    r.readAsDataURL(file);
                });
            }

            try {
                await sb.from('feed_posts').insert({
                    user_id: state.user.id,
                    description: desc,
                    media_url: mediaUrl,
                    media_type: mediaType,
                    liked_by: [],
                    comments: [],
                    created_at: new Date().toISOString()
                });

                const modal = document.getElementById('publish-modal');
                if (modal) modal.remove();
                loadFeedPosts();
            } catch(e) { 
                const modal = document.getElementById('publish-modal');
                if (modal) modal.remove();

        }

                    canvas.width = 160; canvas.height = 160;
                    ctx.drawImage(img, 0, 0, 160, 160);
                    const base64Str = canvas.toDataURL('image/jpeg', 0.7);
                    const imgEl = document.getElementById('profile-img');
                    if (imgEl) imgEl.src = base64Str;
                    await sb.from('profiles').update({ avatar_url: base64Str }).eq('id', state.user.id);

            };
            reader.readAsDataURL(file);

        async function init() {
            setTimeout(hideLoader, 1000);

            try {
                // Intercept dynamic user tokens cleanly without hard failures
                const { data: { session }, error } = await sb.auth.getSession();
                if (error) throw error;
                
                await processSessionSync(session);
                sb.auth.onAuthStateChange((e, s) => processSessionSync(s));
            } catch(err) {
                console.warn("Session auto recovery skipped:", err.message);
                await router.navigate('welcome');
                hideLoader();
            }
        }
        window.onload = init;
    </script>
</body>
</html>
