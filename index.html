<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DutyLog Pro</title>
    
    <!-- Strict Progressive Web App (PWA) Mobile Handling Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DutyLog">
    
    <!-- Dynamic Manifest Injection for Independent Home Screen Standalone Execution -->
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkR1dHlMb2cgUHJvIiwKICAic2hvcnRfbmFtZSI6ICJEdXR5TG9nIiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNGOEY5RkEiLAogICJ0aGVtZV9jb2xvciI6ICIjMUIyNjNCIiwKICAiaWNvbnMiOiBbCiAgICB7CiAgICAgICJzcmMiOiAiaHR0cHM6Ly9hcGkuZGljZWJlYXIuY29tLzcueC9pZGVudGljb24vc3ZnP3NlZWQ9ZHV0eWxvZyIsCiAgICAgICJzaXplcyI6ICI1MTJ4NTEyIiwKICAgICAgInR5cGUiOiAiaW1hZ2Uvc3ZnK3htbCIKICAgIH0KICBdCn0=">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --navy: #1B263B; --green: #00853F; --light-bg: #F8F9FA; --red: #DC2626; }
        body { font-family: 'Inter', sans-serif; background-color: var(--light-bg); -webkit-tap-highlight-color: transparent; margin: 0; padding-top: env(safe-area-inset-top); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.7rem; color: #94A3B8; cursor: pointer; flex: 1; transition: color 0.2s; background: none; border: none; }
        .nav-item.active { color: var(--green); }
        .input-field { width: 100%; padding: 0.8rem; border-radius: 0.8rem; border: 1px solid #e2e8f0; outline: none; font-size: 16px; transition: border 0.2s; background: white; color: var(--navy); -webkit-appearance: none; }
        .input-field:focus { border-color: var(--green); }
        html, body { overflow: hidden; height: 100%; position: fixed; width: 100%; }
        #view-container { overflow-y: auto; height: 100vh; -webkit-overflow-scrolling: touch; padding-bottom: calc(140px + env(safe-area-inset-bottom)); }
        .btn-primary { background: var(--navy); color: white; padding: 1rem; border-radius: 1rem; font-weight: bold; width: 100%; transition: all 0.2s; border: none; cursor: pointer; -webkit-appearance: none; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        
        .scroller-container { display: flex; align-items: center; justify-content: center; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1rem; }
        .scroll-select { background: white; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 1.2rem; font-weight: 800; color: var(--navy); padding: 0.5rem; width: 80px; text-align: center; outline: none; -webkit-appearance: none; }
        
        #init-loader { position: fixed; inset: 0; background: white; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--green); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tag { padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 800; text-transform: uppercase; background: #E2E8F0; color: #475569; }
        .tag-badge { background: #E0F2FE; color: #0369A1; }
        .back-btn { display: flex; align-items: center; gap: 8px; color: var(--navy); font-weight: 600; margin-bottom: 2rem; cursor: pointer; }
        
        .tab-btn { padding: 0.6rem 1rem; font-size: 0.75rem; font-weight: 700; border-radius: 0.75rem; color: #64748B; background: #F1F5F9; transition: all 0.2s; }
        .tab-btn.active { background: var(--navy); color: white; }
        
        .drabsc-trigger { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 1rem; text-align: left; font-weight: 800; border-radius: 1rem; transition: background 0.2s; background: none; border: none; }
        .drabsc-content { max-height: 0; overflow: hidden; transition: max-height 0.25s ease-out; padding: 0 1rem; font-size: 0.85rem; color: #475569; }
        .drabsc-item.open .drabsc-content { max-height: 200px; padding: 0.5rem 1rem 1rem 1rem; }
        .drabsc-letter { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 0.5rem; font-weight: 900; color: white; font-size: 1.1rem; }
    </style>
</head>
<body>

    <!-- Initialization Screen -->
    <div id="init-loader">
        <div class="spinner mb-4"></div>
        <p class="text-navy font-bold animate-pulse">Loading DutyLog Platform...</p>
    </div>

    <!-- App Shell -->
    <div id="app">
        <main id="view-container" class="px-4 pt-6 max-w-[600px] mx-auto"></main>
        
        <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[600px] hidden bg-white border-t px-4 py-3 justify-between items-center z-40 shadow-lg pb-safe">
            <button onclick="router.navigate('dashboard')" class="nav-item active" data-view="dashboard"><i class="fas fa-home text-lg"></i><span>Dashboard</span></button>
            <button onclick="router.navigate('feed')" class="nav-item" data-view="feed"><i class="fas fa-images text-lg"></i><span>Feed</span></button>
            <button onclick="router.navigate('add-duty')" class="nav-item bg-white border-2 border-[#00853F] !text-[#00853F] p-3 -mt-10 rounded-full shadow-xl h-14 w-14 justify-center"><i class="fas fa-plus text-xl"></i></button>
            <button onclick="router.navigate('drabsc-view')" class="nav-item" data-view="drabsc-view"><i class="fas fa-heartbeat text-lg"></i><span>DRABSC</span></button>
            <button onclick="router.navigate('profile')" class="nav-item" data-view="profile"><i class="fas fa-user text-lg"></i><span>Profile</span></button>
        </nav>
    </div>

    <script>
        const supabaseUrl = 'https://qgyjfyazkkepmkztnezv.supabase.co';
        const supabaseKey = 'sb_publishable_xea7e2zxnarbh2bT6vG5ew__2DhOj34';
        
        const sb = window.supabase.createClient(supabaseUrl, supabaseKey, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
        });

        const state = { 
            user: null, 
            profile: null, 
            totalHoursString: "0h 0m",
            currentDuties: [],
            feedPosts: [],
            currentView: null,
            editingDutyId: null,
            timeInputMode: 'duration',
            calculatedHours: 0,
            calculatedMinutes: 0
        };

        const saveLocalCache = (key, data) => localStorage.setItem(`dutylog_pro_${key}`, JSON.stringify(data));
        const getLocalCache = (key) => JSON.parse(localStorage.getItem(`dutylog_pro_${key}`));
        const getUserPFP = (url, id) => url || `https://api.dicebear.com/7.x/avataaars/svg?seed=${id || 'volunteer'}`;

        const router = {
            navigate: async (view) => {
                if (state.currentView === view && !state.editingDutyId) return; 
                state.currentView = view;
                
                const container = document.getElementById('view-container');
                const nav = document.getElementById('bottom-nav');
                if (!container || !nav) return;
                
                const isAuthView = ['welcome', 'login', 'signup'].includes(view);
                
                if (!state.user && !isAuthView) {
                    state.currentView = 'welcome';
                    container.innerHTML = await views.welcome();
                    nav.classList.add('hidden');
                    hideLoader();
                    return;
                }

                nav.classList.toggle('hidden', isAuthView);
                nav.classList.toggle('flex', !isAuthView);
                
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.toggle('active', el.getAttribute('data-view') === view);
                });
                
                if (views[view]) container.innerHTML = await views[view]();
                hideLoader();
            }
        };

        function hideLoader() {
            const loader = document.getElementById('init-loader');
            if (loader) loader.style.display = 'none';
        }

        function parseDatabaseHoursToUiTime(val) {
            const num = parseFloat(val) || 0;
            const hours = Math.floor(num);
            const minutes = Math.round((num - hours) * 60);
            return { hours, minutes };
        }

        function renderDashboardHTML(hoursStr, duties) {
            return duties.map(d => {
                const t = parseDatabaseHoursToUiTime(d.total_hours);
                return `<div class="glass-card p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50" onclick="triggerEditDuty('${d.id}')">
                    <div class="truncate mr-2">
                        <p class="font-bold text-sm text-navy truncate">${d.title || 'Untitled Shift'}</p>
                        <p class="text-[10px] text-slate-400">${d.date}</p>
                    </div>
                    <p class="font-black text-green-600 text-sm flex-shrink-0">+${t.hours}h ${t.minutes}m</p>
                </div>`;
            }).join('') || '<p class="text-center py-10 text-slate-400">No shifts saved yet.</p>';
        }

        const views = {
            welcome: async () => `<div class="flex flex-col items-center justify-center min-h-[80vh] text-center space-y-8">
                <div class="w-24 h-24 bg-white border-4 border-[#00853F] rounded-[2rem] flex items-center justify-center shadow-2xl"><i class="fas fa-clock text-[#00853F] text-5xl"></i></div>
                <div>
                    <h1 class="text-4xl font-black text-[#1B263B]">DutyLog Pro</h1>
                    <p class="text-xs text-slate-400 font-medium mt-1">Operational Hour Tracking Utility</p>
                </div>
                <div class="w-full space-y-3 px-4 max-w-xs">
                    <button onclick="router.navigate('login')" class="btn-primary">Login</button>
                    <button onclick="router.navigate('signup')" class="w-full bg-white border-2 border-[#1B263B] py-4 rounded-2xl font-bold">Register Division Account</button>
                </div>
            </div>`,
            login: async () => `<div class="pt-4 max-w-sm mx-auto">
                <div onclick="router.navigate('welcome')" class="back-btn"><i class="fas fa-arrow-left"></i> Back</div>
                <h2 class="text-2xl font-bold mb-8">Sign In</h2>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <input type="email" id="login-email" placeholder="Email" autocomplete="username" required class="input-field">
                    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required class="input-field">
                    <button type="submit" id="login-btn" class="btn-primary">Sign In</button>
                </form>
            </div>`,
            signup: async () => `<div class="pt-4 max-w-sm mx-auto">
                <div onclick="router.navigate('welcome')" class="back-btn"><i class="fas fa-arrow-left"></i> Back</div>
                <h2 class="text-2xl font-bold mb-6">Create Account</h2>
                <form onsubmit="handleSignup(event)" class="space-y-4">
                    <input type="text" id="signup-name" placeholder="Full Name" required class="input-field">
                    <input type="text" id="signup-division" placeholder="Division (e.g. Cardiff)" required class="input-field">
                    <input type="email" id="signup-email" placeholder="Email" required class="input-field">
                    <input type="password" id="signup-password" placeholder="Password" required class="input-field">
                    <button type="submit" id="signup-btn" class="btn-primary">Register</button>
                </form>
            </div>`,
            dashboard: async () => {
                const cachedDuties = getLocalCache('duties') || [];
                const cachedHoursString = localStorage.getItem('dutylog_totalhours_string') || "0h 0m";
                setTimeout(loadDashboardData, 10);
                return `<div class="space-y-6">
                    <header class="flex justify-between items-center">
                        <div>
                            <h1 class="text-xl font-bold text-navy">${state.profile?.name || 'Volunteer'}</h1>
                            <div class="flex gap-1.5 items-center mt-0.5">
                                <span class="tag text-[9px]">${state.profile?.division || 'Cardiff'}</span>
                                <span class="tag tag-badge text-[9px]">${state.profile?.badge || 'Cadet'}</span>
                            </div>
                        </div>
                        <img src="${getUserPFP(state.profile?.avatar_url, state.user?.id)}" class="w-10 h-10 rounded-full border-2 border-green-500 object-cover shadow-sm">
                    </header>
                    <div class="glass-card p-6 bg-[#1B263B] text-white relative overflow-hidden">
                        <p class="text-[10px] opacity-70 uppercase font-bold tracking-widest">Total Logged Shift Time</p>
                        <h2 class="text-4xl font-black tracking-tight" id="dash-hours-banner">${cachedHoursString}</h2>
                    </div>
                    
                    <!-- Dynamic Hour Export Trigger -->
                    <div class="flex items-center justify-between px-1">
                        <h3 class="font-bold text-navy text-sm">Shift Records</h3>
                        <button onclick="openExportModal()" class="text-xs font-bold text-green-600 bg-green-50 px-2.5 py-1 rounded-lg flex items-center gap-1.5 hover:bg-green-100 transition-all">
                            <i class="fas fa-file-export"></i> Export Hours
                        </button>
                    </div>

                    <div class="space-y-3" id="dashboard-list">
                        ${renderDashboardHTML(cachedHoursString, cachedDuties)}
                    </div>
                </div>`;
            },
            feed: async () => {
                const cachedFeed = getLocalCache('feed') || [];
                setTimeout(loadFeedPosts, 10);
                return `<div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-bold text-navy">Division Feed</h2>
                        <button onclick="openPublishMediaModal()" class="bg-green-600 text-white text-xs font-bold py-2 px-4 rounded-xl"><i class="fas fa-camera mr-1"></i> Post Media</button>
                    </div>
                    <div id="feed-container" class="space-y-6 pb-12">${renderFeedHTML(state.feedPosts.length ? state.feedPosts : cachedFeed)}</div>
                </div>`;
            },
            'drabsc-view': async () => `
                <div class="space-y-4 pb-12">
                    <div>
                        <h2 class="text-2xl font-bold text-navy">Primary Protocol</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Quick reference primary survey assessment guide.</p>
                    </div>
                    <div class="glass-card p-2 bg-white border border-slate-100 space-y-2">
                        <div class="drabsc-item border-b border-slate-100" id="drabsc-d">
                            <button onclick="toggleDrabscItem('drabsc-d')" class="drabsc-trigger">
                                <div class="flex items-center gap-3">
                                    <div class="drabsc-letter bg-red-600">D</div>
                                    <span class="text-xs font-bold text-navy">Danger</span>
                                </div>
                                <i class="fas fa-chevron-down text-slate-300 text-xs"></i>
                            </button>
                            <div class="drabsc-content">Check the surrounding area to ensure it is safe before approaching.</div>
                        </div>
                        <div class="drabsc-item border-b border-slate-100" id="drabsc-r">
                            <button onclick="toggleDrabscItem('drabsc-r')" class="drabsc-trigger">
                                <div class="flex items-center gap-3">
                                    <div class="drabsc-letter bg-orange-500">R</div>
                                    <span class="text-xs font-bold text-navy">Response</span>
                                </div>
                                <i class="fas fa-chevron-down text-slate-300 text-xs"></i>
                            </button>
                            <div class="drabsc-content">Assess alertness using AVPU stimulus checks.</div>
                        </div>
                        <div class="drabsc-item border-b border-slate-100" id="drabsc-a">
                            <button onclick="toggleDrabscItem('drabsc-a')" class="drabsc-trigger">
                                <div class="flex items-center gap-3">
                                    <div class="drabsc-letter bg-yellow-500 text-navy">A</div>
                                    <span class="text-xs font-bold text-navy">Airway</span>
                                </div>
                                <i class="fas fa-chevron-down text-slate-300 text-xs"></i>
                            </button>
                            <div class="drabsc-content">Ensure airway clearance using head-tilt, chin-lift maneuvers.</div>
                        </div>
                        <div class="drabsc-item border-b border-slate-100" id="drabsc-b">
                            <button onclick="toggleDrabscItem('drabsc-b')" class="drabsc-trigger">
                                <div class="flex items-center gap-3">
                                    <div class="drabsc-letter bg-green-600">B</div>
                                    <span class="text-xs font-bold text-navy">Breathing</span>
                                </div>
                                <i class="fas fa-chevron-down text-slate-300 text-xs"></i>
                            </button>
                            <div class="drabsc-content">Look, listen, and feel for normal respiration for up to 10 seconds.</div>
                        </div>
                        <div class="drabsc-item border-b border-slate-100" id="drabsc-s">
                            <button onclick="toggleDrabscItem('drabsc-s')" class="drabsc-trigger">
                                <div class="flex items-center gap-3">
                                    <div class="drabsc-letter bg-blue-600">S</div>
                                    <span class="text-xs font-bold text-navy">Shout (Call 999)</span>
                                </div>
                                <i class="fas fa-chevron-down text-slate-300 text-xs"></i>
                            </button>
                            <div class="drabsc-content">Alert secondary responders or task emergency services dispatch.</div>
                        </div>
                        <div class="drabsc-item" id="drabsc-c">
                            <button onclick="toggleDrabscItem('drabsc-c')" class="drabsc-trigger">
                                <div class="flex items-center gap-3">
                                    <div class="drabsc-letter bg-purple-700">C</div>
                                    <span class="text-xs font-bold text-navy">CPR</span>
                                </div>
                                <i class="fas fa-chevron-down text-slate-300 text-xs"></i>
                            </button>
                            <div class="drabsc-content">Initiate high-quality rhythmic chest compressions at 30:2 ratios.</div>
                        </div>
                    </div>
                </div>`,
            'add-duty': async () => {
                let targetLog = { title: '', date: new Date().toISOString().split('T')[0], total_hours: '0.00' };
                if (state.editingDutyId) {
                    const found = state.currentDuties.find(d => d.id === state.editingDutyId);
                    if (found) targetLog = found;
                }
                const parsedTime = parseDatabaseHoursToUiTime(targetLog.total_hours);
                
                state.calculatedHours = parsedTime.hours;
                state.calculatedMinutes = parsedTime.minutes;
                state.timeInputMode = 'duration'; 

                setTimeout(() => {
                    switchTimeInputMode('duration', parsedTime.hours, parsedTime.minutes);
                }, 15);

                return `<div class="px-2 space-y-4">
                    <h2 class="text-2xl font-bold text-navy">${state.editingDutyId ? 'Modify Shift Record' : 'Log Operational Duty'}</h2>
                    
                    <form onsubmit="handleSaveDuty(event)" class="space-y-4">
                        <input type="text" id="duty-title" placeholder="Event / Shift Title" value="${targetLog.title}" required class="input-field">
                        <input type="date" id="duty-date" value="${targetLog.date}" class="input-field">
                        
                        <div class="glass-card p-4 space-y-4">
                            <div class="flex justify-center gap-2 border-b pb-3 border-slate-100">
                                <button type="button" id="tab-duration" onclick="switchTimeInputMode('duration')" class="tab-btn active">Log Duration</button>
                                <button type="button" id="tab-window" onclick="switchTimeInputMode('window')" class="tab-btn">Log Start / End</button>
                            </div>
                            
                            <div id="time-input-container-mount"></div>
                            <div class="text-center text-xs font-bold text-green-600 mt-2">Calculated Total Time: <span id="calc-display">0h 0m</span></div>
                        </div>

                        <button type="submit" id="duty-save-btn" class="btn-primary !bg-[#00853F]">Save Shift</button>
                    </form>
                </div>`;
            },
            profile: async () => `<div class="space-y-6 pt-4 max-w-sm mx-auto">
                <div class="relative w-24 h-24 mx-auto text-center">
                    <img id="profile-img" src="${getUserPFP(state.profile?.avatar_url, state.user?.id)}" class="w-24 h-24 rounded-full border-4 border-green-500 shadow-lg object-cover mx-auto">
                    <label class="absolute bottom-0 right-2 bg-navy text-white rounded-full p-2 text-xs shadow-md border border-white cursor-pointer">
                        <i class="fas fa-camera"></i>
                        <input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="uploadCompressedAvatar(event)">
                    </label>
                </div>
                
                <form onsubmit="handleUpdateProfile(event)" class="glass-card p-5 space-y-4 bg-white">
                    <h3 class="font-bold text-navy text-sm border-b pb-2"><i class="fas fa-sliders-h mr-2 text-green-600"></i>Edit Settings</h3>
                    <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">Username / Name</label>
                        <input type="text" id="profile-name" value="${state.profile?.name || ''}" class="input-field text-sm" required placeholder="Enter name">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 block mb-1">Badge / Rank</label>
                        <input type="text" id="profile-badge" value="${state.profile?.badge || ''}" class="input-field text-sm font-semibold" required placeholder="e.g. Cadet">
                    </div>
                    <button type="submit" id="profile-save-btn" class="w-full bg-[#00853F] text-white p-3 rounded-xl font-bold text-sm shadow-md">Save Changes</button>
                </form>

                <!-- Export Data Segment inside profile screen -->
                <div class="glass-card p-5 bg-white space-y-3">
                    <h3 class="font-bold text-navy text-sm border-b pb-2"><i class="fas fa-file-export mr-2 text-indigo-600"></i>Export Hours Data</h3>
                    <p class="text-[11px] text-slate-400">Compile your logged shift timeline to spreadsheets, text summaries, or structured emails.</p>
                    <button onclick="openExportModal()" class="w-full bg-indigo-600 text-white p-3 rounded-xl font-bold text-xs shadow-sm"><i class="fas fa-file-export mr-2"></i>Export Summary</button>
                </div>

                <button onclick="handleLogout()" class="w-full bg-red-500 text-white p-4 rounded-2xl font-bold shadow-md">Sign Out Account</button>
            </div>`
        };

        // --- DYNAMIC DATA EXPORT COMPILATION ENGINE ---
        window.openExportModal = function() {
            const modal = document.createElement('div');
            modal.id = 'export-modal';
            modal.className = 'fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm';
            modal.innerHTML = `
                <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                    <div class="flex items-center justify-between text-[#00853F] font-black text-sm">
                        <span class="flex items-center gap-2"><i class="fas fa-file-export"></i> Export Hours Utility</span>
                        <button onclick="document.getElementById('export-modal').remove()" class="text-slate-400"><i class="fas fa-times"></i></button>
                    </div>
                    <p class="text-[11px] text-slate-400 leading-relaxed">Choose how you want to compile and share your operational hours. Perfect for reporting back to division leads.</p>
                    
                    <div class="grid grid-cols-1 gap-2.5 pt-2">
                        <!-- Email Export -->
                        <button onclick="exportToEmail()" class="w-full flex items-center gap-3 p-3 bg-slate-50 border border-slate-100 hover:bg-slate-100 rounded-xl text-left transition-all">
                            <div class="w-10 h-10 bg-green-100 text-green-700 rounded-lg flex items-center justify-center text-sm font-black"><i class="fas fa-envelope"></i></div>
                            <div class="truncate">
                                <p class="text-xs font-bold text-navy">Export to Email</p>

                            </div>
                        </button>
                        
                        <!-- CSV Spreadsheet -->
                        <button onclick="exportToCSV()" class="w-full flex items-center gap-3 p-3 bg-slate-50 border border-slate-100 hover:bg-slate-100 rounded-xl text-left transition-all">
                            <div class="w-10 h-10 bg-indigo-100 text-indigo-700 rounded-lg flex items-center justify-center text-sm font-black"><i class="fas fa-file-csv"></i></div>
                            <div class="truncate">
                                <p class="text-xs font-bold text-navy">Download Spreadsheet (.CSV)</p>

                        </button>
                        
                        <!-- Copy to Clipboard -->
                        <button onclick="copyHoursToClipboard()" class="w-full flex items-center gap-3 p-3 bg-slate-50 border border-slate-100 hover:bg-slate-100 rounded-xl text-left transition-all">
                            <div class="w-10 h-10 bg-blue-100 text-blue-700 rounded-lg flex items-center justify-center text-sm font-black"><i class="fas fa-copy"></i></div>
                            <div class="truncate">
                                <p class="text-xs font-bold text-navy">Copy Plain-Text Summary</p>

        window.exportToEmail = function() {
            if (state.currentDuties.length === 0) {
                alert("No shift logs available to export.");
                return;
            }
            const emailSubject = encodeURIComponent(`DutyLog Pro Hours Summary - ${state.profile?.name || 'Member'}`);
            let emailBody = `DutyLog Pro - Operational Hours Export\n`;
            emailBody += `Generated on: ${new Date().toLocaleDateString()}\n`;
            emailBody += `Volunteer Name: ${state.profile?.name || 'Member'}\n`;
            emailBody += `Division Unit: ${state.profile?.division || 'Cardiff'}\n`;
            emailBody += `Rank/Badge: ${state.profile?.badge || 'Cadet'}\n`;
            emailBody += `Total Cumulative Hours: ${state.totalHoursString}\n\n`;
            emailBody += `--- SHIFT RECORDS BREAKDOWN ---\n`;
            
            state.currentDuties.forEach((d, i) => {
                const t = parseDatabaseHoursToUiTime(d.total_hours);
                emailBody += `[${i+1}] ${d.date} | ${d.title || 'Untitled'} | ${t.hours}h ${t.minutes}m\n`;
            });
            
            emailBody += `\nSent securely via DutyLog Pro System`;
            window.location.href = `mailto:?subject=${emailSubject}&body=${encodeURIComponent(emailBody)}`;
        };

        window.exportToCSV = function() {
            if (state.currentDuties.length === 0) {
                alert("No shift logs available to export.");
                return;
            }
            // Headers matches standard reporting columns
            let csvRows = ["Title,Date,Decimal Hours,Formatted Hours"];
            state.currentDuties.forEach(d => {
                const t = parseDatabaseHoursToUiTime(d.total_hours);
                const decimalHours = (t.hours + (t.minutes / 60)).toFixed(2);
                const formatted = `${t.hours}h ${t.minutes}m`;
                const escapedTitle = (d.title || 'Untitled').replace(/"/g, '""');
                csvRows.push(`"${escapedTitle}","${d.date}",${decimalHours},"${formatted}"`);
            });
            
            const csvString = csvRows.join("\r\n");
            const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.setAttribute("download", `dutylog_hours_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.copyHoursToClipboard = function() {
            if (state.currentDuties.length === 0) {
                alert("No shift logs available to export.");
                return;
            }
            let copyText = `DutyLog Pro Hours Summary\n`;
            copyText += `Volunteer: ${state.profile?.name || 'Member'} (${state.profile?.division || 'Cardiff'})\n`;
            copyText += `Total Hours: ${state.totalHoursString}\n\n`;
            
            state.currentDuties.forEach((d, i) => {
                const t = parseDatabaseHoursToUiTime(d.total_hours);
                copyText += `• ${d.date} - ${d.title || 'Untitled'}: ${t.hours}h ${t.minutes}m\n`;
            });
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(copyText).then(() => {
                    alert("Summary successfully copied to your clipboard!");
                }).catch(() => {
                    fallbackCopyText(copyText);
                });
            } else {
                fallbackCopyText(copyText);
            }
        };
        
        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                alert("Summary successfully copied to clipboard!");
            } catch (err) {
                alert("Could not copy automatically. Please copy the summary text manually.");
            }
            document.body.removeChild(textArea);
        }

        window.toggleDrabscItem = function(elementId) {
            const item = document.getElementById(elementId);
            if (!item) return;
            const isOpen = item.classList.contains('open');
            document.querySelectorAll('.drabsc-item').forEach(el => {
                el.classList.remove('open');
                el.querySelector('.fa-chevron-down')?.classList.remove('rotate-180');
            });
            if (!isOpen) {
                item.classList.add('open');
                item.querySelector('.fa-chevron-down')?.classList.add('rotate-180');
            }
        };

        window.switchTimeInputMode = function(mode, defaultH = 0, defaultM = 0) {
            state.timeInputMode = mode;
            const durTab = document.getElementById('tab-duration');
            const winTab = document.getElementById('tab-window');
            if(durTab) durTab.classList.toggle('active', mode === 'duration');
            if(winTab) winTab.classList.toggle('active', mode === 'window');
            
            const mount = document.getElementById('time-input-container-mount');
            if (!mount) return;

            if (mode === 'duration') {
                let hourOptions = "", minOptions = "";
                for (let i = 0; i <= 24; i++) hourOptions += `<option value="${i}" ${i === defaultH ? 'selected' : ''}>${i}</option>`;
                for (let i = 0; i < 60; i += 5) minOptions += `<option value="${i}" ${i === defaultM ? 'selected' : ''}>${i < 10 ? '0' + i : i}</option>`;
                
                mount.innerHTML = `
                    <div class="scroller-container">
                        <div class="scroll-wheel-column"><select id="scroll-hr" class="scroll-select" onchange="updateScrollCalculation()">${hourOptions}</select></div>
                        <div class="text-xl font-black text-slate-400 px-2">:</div>
                        <div class="scroll-wheel-column"><select id="scroll-min" class="scroll-select" onchange="updateScrollCalculation()">${minOptions}</select></div>
                    </div>`;
                updateScrollCalculation();
            } else {
                mount.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Start Time</label>
                            <input type="time" id="time-start" class="input-field font-bold text-center" onchange="updateWindowCalculation()">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">End Time</label>
                            <input type="time" id="time-end" class="input-field font-bold text-center" onchange="updateWindowCalculation()">
                        </div>
                    </div>`;
                const display = document.getElementById('calc-display');
                if(display) display.innerText = `${state.calculatedHours}h ${state.calculatedMinutes}m`;
            }
        };

        window.updateScrollCalculation = function() {
            const hrEl = document.getElementById('scroll-hr');
            const minEl = document.getElementById('scroll-min');
            if(!hrEl || !minEl) return;
            state.calculatedHours = parseInt(hrEl.value) || 0;
            state.calculatedMinutes = parseInt(minEl.value) || 0;
            const display = document.getElementById('calc-display');
            if(display) display.innerText = `${state.calculatedHours}h ${state.calculatedMinutes}m`;
        };

        window.updateWindowCalculation = function() {
            const startVal = document.getElementById('time-start').value;
            const endVal = document.getElementById('time-end').value;
            if (!startVal || !endVal) return;

            const [startH, startM] = startVal.split(':').map(Number);
            let [endH, endM] = endVal.split(':').map(Number);

            let diffMins = (endH * 60 + endM) - (startH * 60 + startM);
            if (diffMins < 0) diffMins += 24 * 60; 

            state.calculatedHours = Math.floor(diffMins / 60);
            state.calculatedMinutes = diffMins % 60;
            const display = document.getElementById('calc-display');
            if(display) display.innerText = `${state.calculatedHours}h ${state.calculatedMinutes}m`;
        };

        function renderFeedHTML(posts) {
            if (!posts || posts.length === 0) return '<p class="text-center py-12 text-slate-400 text-xs">No media uploads found in division stream.</p>';
            return posts.map(p => {
                const hasLiked = p.liked_by_me;
                const totalLikes = p.like_count || 0;
                return `
                <div class="glass-card overflow-hidden bg-white border border-slate-100 shadow-sm">
                    <div class="p-4 flex items-center gap-3">
                        <img src="${getUserPFP(p.profiles?.avatar_url, p.user_id)}" class="w-9 h-9 rounded-full object-cover">
                        <div>
                            <div class="flex items-center gap-1.5">
                                <p class="text-sm font-black text-navy">${p.profiles?.name || 'Division Member'}</p>
                                <span class="tag tag-badge !text-[8px] !py-0.5 !px-1.5">${p.profiles?.badge || 'Cadet'}</span>
                            </div>
                            <p class="text-[9px] text-slate-400 font-medium mt-0.5">${new Date(p.created_at).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <div class="px-4 pb-2"><p class="text-xs text-slate-700 leading-relaxed">${p.description || ''}</p></div>
                    ${p.media_url ? `
                        <div class="w-full bg-black flex items-center justify-center max-h-[350px] overflow-hidden">
                            ${p.media_url.startsWith('data:video') || p.media_type === 'video' ? 
                                `<video src="${p.media_url}" controls playsinline class="w-full object-contain"></video>` : 
                                `<img src="${p.media_url}" class="w-full object-cover">`
                            }
                        </div>` : ''
                    }
                    <div class="p-3 border-t flex gap-6 items-center text-slate-500">
                        <button onclick="toggleLikePost('${p.id}', ${hasLiked})" class="flex items-center gap-1.5 text-xs font-bold ${hasLiked ? 'text-red-500' : ''}">
                            <i class="${hasLiked ? 'fas' : 'far'} fa-heart"></i> <span>${totalLikes}</span>
                        </button>
                        <button onclick="openCommentsDrawer('${p.id}')" class="flex items-center gap-1.5 text-xs font-bold">
                            <i class="far fa-comment"></i> <span>${p.comments?.length || 0} Comments</span>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        async function loadDashboardData() {
            try {
                const { data, error } = await sb.from('hours_logs').select('*').eq('user_id', state.user.id).order('date', { ascending: false });
                if (error) throw error;
                state.currentDuties = data || [];
                let totalMin = 0;
                state.currentDuties.forEach(d => {
                    const t = parseDatabaseHoursToUiTime(d.total_hours);
                    totalMin += (t.hours * 60) + t.minutes;
                });
                state.totalHoursString = `${Math.floor(totalMin / 60)}h ${totalMin % 60}m`;
                localStorage.setItem('dutylog_totalhours_string', state.totalHoursString);
                saveLocalCache('duties', state.currentDuties);
                
                if(state.currentView === 'dashboard') {
                    const banner = document.getElementById('dash-hours-banner');
                    if(banner) banner.innerText = state.totalHoursString;
                    const dList = document.getElementById('dashboard-list');
                    if(dList) dList.innerHTML = renderDashboardHTML(state.totalHoursString, state.currentDuties);
                }
            } catch(e){}
        }

        async function loadFeedPosts() {
            try {
                const { data, error } = await sb.from('feed_posts').select('*, profiles(name, avatar_url, badge)').order('created_at', { ascending: false });
                if (error) throw error;
                state.feedPosts = (data || []).map(p => ({
                    ...p,
                    liked_by_me: Array.isArray(p.liked_by) && p.liked_by.includes(state.user.id),
                    like_count: Array.isArray(p.liked_by) ? p.liked_by.length : 0
                }));
                saveLocalCache('feed', state.feedPosts);
                if (state.currentView === 'feed') {
                    const fCont = document.getElementById('feed-container');
                    if(fCont) fCont.innerHTML = renderFeedHTML(state.feedPosts);
                }
            } catch(e){}
        }

        async function handleUpdateProfile(e) {
            e.preventDefault();
            const btn = document.getElementById('profile-save-btn');
            const name = document.getElementById('profile-name').value;
            const badge = document.getElementById('profile-badge').value;

            if (btn) { btn.innerText = "Saving Changes..."; btn.disabled = true; }
            try {
                const { error } = await sb.from('profiles').update({ name, badge }).eq('id', state.user.id);
                if (error) throw error;
                state.profile.name = name;
                state.profile.badge = badge;
                alert("Profile changes applied successfully!");
            } catch(err) {
                alert("Saved to application sandbox cache.");
            } finally {
                if (btn) { btn.innerText = "Save Changes"; btn.disabled = false; }
            }
        }

        window.openPublishMediaModal = function() {
            const modal = document.createElement('div');
            modal.id = 'publish-modal';
            modal.className = 'fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm';
            modal.innerHTML = `
                <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                    <h3 class="font-black text-navy text-base">Post to Division Feed</h3>
                    <textarea id="post-desc" placeholder="What happened on this shift duty?" class="input-field min-h-[80px] text-sm"></textarea>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 block">Attach Media</label>
                        <input type="file" id="feed-file-input" accept="image/*,video/*" class="input-field text-xs">
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button onclick="document.getElementById('publish-modal').remove()" class="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl text-xs">Cancel</button>
                        <button id="post-submit-btn" onclick="submitFeedPost()" class="flex-1 py-3 bg-green-600 text-white font-bold rounded-xl text-xs">Publish Post</button>
                    </div>
                </div>`;
            document.getElementById('app').appendChild(modal);
        };

        async function submitFeedPost() {
            const btn = document.getElementById('post-submit-btn');
            const desc = document.getElementById('post-desc').value;
            const fileInput = document.getElementById('feed-file-input');
            const file = fileInput.files ? fileInput.files[0] : null;
            
            if (btn) { btn.innerText = "Uploading..."; btn.disabled = true; }
            let mediaUrl = null, mediaType = 'image';

            if (file) {
                mediaType = file.type.startsWith('video') ? 'video' : 'image';
                mediaUrl = await new Promise((res) => {
                    const r = new FileReader();
                    r.onload = (e) => res(e.target.result);
                    r.readAsDataURL(file);
                });
            }

            try {
                const { error } = await sb.from('feed_posts').insert({
                    user_id: state.user.id, description: desc, media_url: mediaUrl, media_type: mediaType, liked_by: [], comments: [], created_at: new Date().toISOString()
                });
                if (error) throw error;
                document.getElementById('publish-modal').remove();
                loadFeedPosts();
            } catch(e) { 
                if (btn) { btn.innerText = "Publish Post"; btn.disabled = false; }
            }
        }

        window.toggleLikePost = async function(postId, currentlyLiked) {
            try {
                const post = state.feedPosts.find(p => p.id === postId);
                if (!post) return;
                let updatedLikes = Array.isArray(post.liked_by) ? post.liked_by : [];
                if (currentlyLiked) {
                    updatedLikes = updatedLikes.filter(id => id !== state.user.id);
                } else {
                    updatedLikes.push(state.user.id);
                }
                const { error } = await sb.from('feed_posts').update({ liked_by: updatedLikes }).eq('id', postId);
                if (error) throw error;
                loadFeedPosts();
            } catch(e){}
        };

        window.openCommentsDrawer = async function(postId) {
            const post = state.feedPosts.find(p => p.id === postId);
            if (!post) return;
            const modal = document.createElement('div');
            modal.id = 'comments-modal';
            modal.className = 'fixed inset-0 bg-black/40 z-50 flex items-end justify-center backdrop-blur-sm';
            modal.innerHTML = `
                <div class="bg-white rounded-t-3xl w-full max-w-md p-6 max-h-[80vh] flex flex-col justify-between shadow-2xl">
                    <div class="overflow-y-auto space-y-4">
                        <div class="flex justify-between items-center border-b pb-2">
                            <h3 class="font-bold text-navy text-sm">Comments</h3>
                            <button onclick="document.getElementById('comments-modal').remove()" class="text-slate-400"><i class="fas fa-times"></i></button>
                        </div>
                        <div id="comments-box" class="space-y-3 min-h-[150px]">
                            ${(post.comments || []).map(c => `<div class="text-xs bg-slate-50 p-2 rounded-xl"><strong>${c.user_name || 'Member'}:</strong> ${c.text}</div>`).join('') || '<p class="text-slate-400 text-xs text-center py-6">No comments yet.</p>'}
                        </div>
                    </div>
                    <div class="pt-4 border-t flex gap-2">
                        <input type="text" id="new-comment-txt" placeholder="Add a public comment..." class="input-field text-xs flex-1">
                        <button onclick="submitComment('${postId}')" class="bg-navy text-white text-xs font-bold px-4 rounded-xl">Post</button>
                    </div>
                </div>`;
            document.getElementById('app').appendChild(modal);
        };

        async function submitComment(postId) {
            const txt = document.getElementById('new-comment-txt').value;
            if(!txt) return;
            try {
                const post = state.feedPosts.find(p => p.id === postId);
                const currentComments = Array.isArray(post.comments) ? post.comments : [];
                currentComments.push({ user_name: state.profile?.name || 'Member', text: txt, created_at: new Date().toISOString() });
                const { error } = await sb.from('feed_posts').update({ comments: currentComments }).eq('id', postId);
                if (error) throw error;
                document.getElementById('comments-modal').remove();
                loadFeedPosts();
            } catch(e){}
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            if (btn) { btn.innerText = "Verifying..."; btn.disabled = true; }
            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) throw error;
                if (data?.session) await processSessionSync(data.session);
            } catch (err) {
                alert(`Login Failed: ${err.message}`);
                if (btn) { btn.innerText = "Sign In"; btn.disabled = false; }
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('signup-btn');
            const name = document.getElementById('signup-name').value;
            const division = document.getElementById('signup-division').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            if (btn) { btn.innerText = "Registering..."; btn.disabled = true; }
            try {
                const { data, error } = await sb.auth.signUp({ email, password });
                if (error) throw error;
                if (data?.user) {
                    await sb.from('profiles').upsert({ id: data.user.id, name, division, badge: 'Cadet' });
                    alert("Account registered! You can now sign in.");
                    router.navigate('login');
                }
            } catch (networkError) {
                alert(`Registration Failed: ${networkError.message}`);
                if (btn) { btn.innerText = "Register"; btn.disabled = false; }
            }
        }

        window.triggerEditDuty = function(id) { state.editingDutyId = id; router.navigate('add-duty'); };

        async function handleSaveDuty(e) {
            e.preventDefault();
            const h = state.calculatedHours;
            const m = state.calculatedMinutes;
            const decimalVal = parseFloat(`${h}.${m < 10 ? '0' + m : m}`);
            
            const logObj = { 
                user_id: state.user.id, 
                title: document.getElementById('duty-title').value, 
                date: document.getElementById('duty-date').value, 
                total_hours: decimalVal 
            };
            
            try {
                if (state.editingDutyId) {
                    const { error } = await sb.from('hours_logs').update(logObj).eq('id', state.editingDutyId);
                    if (error) throw error;
                    state.editingDutyId = null;
                } else {
                    const { error } = await sb.from('hours_logs').insert(logObj);
                    if (error) throw error;
                }
            } catch(err){}
            router.navigate('dashboard');
        }

        window.uploadCompressedAvatar = function(event) {
            const file = event.target.files ? event.target.files[0] : null;
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 160; canvas.height = 160;
                    ctx.drawImage(img, 0, 0, 160, 160);
                    const base64Str = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('profile-img').src = base64Str;
                    try { await sb.from('profiles').update({ avatar_url: base64Str }).eq('id', state.user.id); } catch(err){}
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        async function handleLogout() { 
            try { await sb.auth.signOut(); } catch(e){}
            window.location.reload(); 
        }

        async function processSessionSync(session) {
            if (session) {
                state.user = session.user;
                try {
                    const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
                    state.profile = data || { name: 'Cadet Member', division: 'Cardiff', badge: 'Cadet' };
                } catch(e) {
                    state.profile = { name: 'Cadet Member', division: 'Cardiff', badge: 'Cadet' };
                }
                await router.navigate('dashboard');
            } else {
                state.user = null; state.profile = null;
                await router.navigate('welcome');
            }
            hideLoader();
        }

        async function init() {
            setTimeout(hideLoader, 1200);
            try {
                const fallbackSessionKey = Object.keys(localStorage).find(key => key.startsWith('sb-') && key.endsWith('-auth-token'));
                let rawSession = fallbackSessionKey ? JSON.parse(localStorage.getItem(fallbackSessionKey)) : null;
                const { data: { session } } = await sb.auth.getSession();
                const activeSession = session || rawSession;
                await processSessionSync(activeSession);
                sb.auth.onAuthStateChange((e, s) => processSessionSync(s || rawSession));
            } catch(err) {
                await router.navigate('welcome');
                hideLoader();
            }
        }
        window.onload = init;
    </script>
</body>
